services:
  - type: web
    name: xandorabackend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DISABLE_REDIS
        value: "1"
      - key: DISABLE_RABBIT
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://xandora-webapp.web.app
      - key: DATABASE_URL
        fromDatabase:
          name: xandora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SCAN_API_KEY
        generateValue: true
      - key: POS_API_KEY
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: AUTO_CREATE_CATALOG_FROM_SCANS
        value: "0"

  - type: web
    name: xandora-retail-console
    runtime: node
    region: oregon
    plan: free
    rootDir: xandora-retail-console
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_SIM_ENABLED
        value: "0"
      - key: MAIN_API_URL
        value: https://xandorabackend-44dt.onrender.com

databases:
  - name: xandora-db
    region: oregon
    plan: free
    databaseName: rfid
    user: xandora
