name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rfid-dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: rfid-dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: rfid-dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: rfid-dashboard
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rfid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rfid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rfid
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rfid
      REDIS_URL: redis://127.0.0.1:6379
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
      DISABLE_REDIS: 0
      DISABLE_RABBIT: 0
      FRONTEND_ORIGIN: http://127.0.0.1:4173
      VITE_API_BASE_URL: http://127.0.0.1:3000/api/v1
      JWT_SECRET: ci-jwt-secret
      SCAN_API_KEY: ci-scan-key
      POS_API_KEY: ci-pos-key
      DEVICE_API_KEY: ci-device-key
      E2E_MASTER_ADMIN_EMAIL: admin@xandora.local
      E2E_MASTER_ADMIN_PASSWORD: ChangeMe!123
      E2E_COMPANY_ADMIN_EMAIL: ops@northline-retail.local
      E2E_COMPANY_ADMIN_PASSWORD: ChangeMe!123
      E2E_COMPANY_NAME: Northline Retail
      E2E_STORE_ID: NORTHLINE_001
      E2E_STORE_NAME: Northline Flagship

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rfid-dashboard/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: rfid-dashboard
        run: npm ci

      - name: Apply database migrations
        run: node scripts/run_migrations.js

      - name: Bootstrap browser test accounts
        run: node scripts/bootstrap_e2e_accounts.js

      - name: Install Playwright browser
        working-directory: rfid-dashboard
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: rfid-dashboard
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: rfid-dashboard/playwright-report
          if-no-files-found: ignore
